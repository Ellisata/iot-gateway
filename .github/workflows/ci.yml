name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # - name: go test
      #   working-directory: backend
      #   run: go test -count=1 -timeout 20m ./...

  sdk:
    name: Driver SDK (Apache-2.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/sdk/go.mod

      - name: gofmt
        working-directory: backend/sdk
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend/sdk
        run: go vet ./...

      - name: go test
        working-directory: backend/sdk
        run: go test -count=1 ./...

      - name: Build example plugin
        working-directory: backend/sdk
        run: go build -o /tmp/iot-driver-hello ./examples/hello-driver

      # 许可证边界守卫：SDK 是 Apache-2.0，绝不能反向依赖 AGPL 的网关核心。
      # 否则「第三方可以闭源写驱动」这句话在法律上就不成立。
      - name: SDK must not depend on the AGPL core
        working-directory: backend/sdk
        run: |
          if grep -rn '"iot-gateway/' --include='*.go' .; then
            echo "::error::SDK imports the AGPL gateway core"
            exit 1
          fi
          if go list -deps ./... | grep -qE '^(iot-gateway|github\.com/Ellisata/iot-gateway)(/|$)'; then
            echo "::error::SDK dependency graph contains the AGPL gateway core"
            exit 1
          fi

  # 只跑「真实插件源码 + 宿主」的 Modbus 集成测试：这是 SDK 与核心线协议
  # 不漂移的最短反馈。全量 go test 仍按上面的注释策略不阻塞 PR。
  modbus-plugin:
    name: Modbus plugin ↔ host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Integration tests
        working-directory: backend
        run: |
          (cd driversrc && go test ./modbus/... -count=1)
          go test ./pluginhost -run 'TestModbusPlugin' -count=1 -timeout 10m

  # race 检测只在 master push / 手动触发时跑，不阻塞 PR 反馈。
  # 想彻底关掉：删除本 job 即可（其余 job 不依赖它）。
  # backend-race:
  #   name: Backend (Linux, race)
  #   if: github.event_name != 'pull_request'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 40
  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: actions/setup-go@v5
  #       with:
  #         go-version-file: backend/go.mod
  #         cache-dependency-path: backend/go.sum

  #     - name: go test -race
  #       working-directory: backend
  #       run: go test -race -count=1 -timeout 30m ./...

  backend-windows:
    name: Backend (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # - name: go test
      #   working-directory: backend
      #   run: go test -count=1 -timeout 20m ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm run build
        working-directory: frontend
        run: npm run build

  build:
    name: Build (all platforms)
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      # 与本地 / 发行包完全同一条构建路径：前端构建 → 嵌入产物 → 4 平台交叉编译 + 全部插件。
      - name: Cross-compile main binary and plugins
        run: bash ./build.sh

      - name: Verify build artifacts
        run: |
          expected=$(find backend/driversrc -mindepth 2 -maxdepth 2 -name main.go | wc -l)
          echo "expected plugins per platform: $expected"

          for f in \
            backend/iot-gateway \
            backend/iot-gateway-linux-arm64 \
            backend/iot-gateway-linux-arm \
            backend/iot-gateway.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::missing binary: $f"
              exit 1
            fi
            echo "ok: $f"
          done

          for d in \
            backend/plugins-linux \
            backend/plugins-linux-arm64 \
            backend/plugins-linux-arm \
            backend/plugins-windows; do
            n=$(find "$d" -maxdepth 1 -type f -name 'iot-driver-*' | wc -l)
            echo "$d: $n plugins"
            if [ "$n" -ne "$expected" ]; then
              echo "::error::$d has $n plugins, expected $expected"
              exit 1
            fi
          done
