server:
  port: 9082

jwt:
  # 登录令牌签名密钥。留空时每次启动自动随机生成（重启后所有登录态失效）。
  # 生产环境建议固定密钥以保证重启后登录态不丢：优先读环境变量 IOT_GATEWAY_JWT_SECRET，
  # 否则使用此处配置值。切勿使用公开仓库中的示例值。
  secret: "019fabb7b602768a9e77625096cf01c2"
  expireHour: 24
  issuer: iot-gateway

auth:
  # 初始 admin 账号口令，**仅在首次启动（用户表为空）时生效**。
  # 留空时优先读环境变量 IOT_GATEWAY_ADMIN_PASSWORD，仍为空则随机生成口令
  # 并打印到日志（只打印这一次，注意留存）。账号建好后本项不再被读取，
  # 改密码请走登录后的修改密码接口。
  defaultAdminPassword: "hand@123"

log:
  level: INFO
  outputDir: log
  maxSizeMB: 10   # 单个日志文件大小上限（MB），超过后滚动为 app-日期-N.log
  maxDays: 30     # 日志文件最大保留天数，超过后自动删除

sqlite:
  path: data/iot-gateway.db              # SQLite 数据库文件路径

gateway:
  # 网关自身身份，首次启动（iot_gateway 表为空）时建行。name 与 version 之后的行为不同：
  #
  # name 留空时按「环境变量 IOT_GATEWAY_NAME > 本项 > 主机名 > IoT Gateway」解析；
  # 多台网关同时接入平台时，主机名兜底能让它们天然区分开。
  # **建行之后再改本项不会生效**（预期行为，不是 bug）：网关名称改由管理端
  # 「系统设置」页面维护。首次部署前在这里配好即可，之后请走页面。
  name: ""
  # 网关软件版本号，随发行版更新（也可用环境变量 IOT_GATEWAY_VERSION 覆盖）。
  # **本项是权威值**：每次启动都与库内比对，不一致就刷新库里的值，故升级时改这里
  # 即可，无需人工干预。页面上该字段只读 —— 版本是二进制自身的属性，交给页面改
  # 只会让库里的值与实际运行的二进制对不上。
  version: "1.0.2"

# 局域网自动发现：网关周期性把自己的身份（id / 名称 / IP / 端口 / 固件版本 / 描述）
# 以 UDP 广播发到所在网段，并单播应答管理平台的探询，使其他管理平台无需预配置、
# 无需凭据即可自动发现本网关。完整报文契约见 specs/discovery.md。
discovery:
  # 总开关。**出厂即为 true**：发现功能是"接进来就能用"的前提，
  # 关掉它等于要求运维在管理平台逐台手工录入网关地址。
  #
  # 关闭后网关对局域网完全静默，不影响采集与上报。
  enabled: true

  # UDP 端口，广播与监听共用。管理平台监听同一个端口。
  #
  # 该端口不是保留端口，收到陌生报文属正常现象（网关侧会静默丢弃）。
  # 同一主机跑第二个网关实例会因端口占用而启动失败 —— 非致命，只记一条
  # ERROR，采集与上报照常；两个实例共用一个接收端口会让探询应答落到
  # 不确定的那个实例上，所以这里刻意不做端口复用。
  #
  # **Windows 防火墙注意**：出站广播默认放行，但入站 9083 默认被拦截，
  # 且以 Windows 服务（SCM）方式运行时不会弹交互式放行提示 —— 表现为
  # "管理平台能看到网关通知，但主动探询收不到应答"。手工放行：
  #   netsh advfirewall firewall add rule name="IoT Gateway Discovery" ^
  #     dir=in action=allow protocol=UDP localport=9083
  port: 9083

  # 广播间隔（毫秒）。启动时会额外立即广播一次，因此管理平台最坏等待时长
  # 等于本值，最好情况是一次报文内就发现。刻意做小（5s）以兼顾"改完名称
  # 很快看到生效"和"局域网广播噪声"。
  intervalMs: 5000

# 局域网 PLC 扫描发现：网关主动扫本机各网段，把扫到的 PLC 列出来，
# 勾选后一键建成设备。
#
# **与上面的 discovery 段方向相反**，别混：discovery 是网关广播"我在哪"，
# 供管理平台发现自己；本段是网关去问"网段里谁在"。
#
# 哪些协议能被扫描由**协议插件**声明（driversdk 的 Protocol.Discovery），
# 因此这里没有"启用哪个协议"的开关 —— 插件没声明就扫不了，前端下拉里也不会出现。
# 探测超时同样不在本段：它是每协议的属性，由插件自报。
deviceScan:
  # 总开关。**出厂即为 true**，与 plugin.enabled / discovery.enabled 同一取舍：
  # 扫描是"接进来就能用"的能力，关掉它等于要求运维在图纸上逐台查 PLC 的 IP。
  #
  # 需要关掉的理由主要是合规：扫描会主动向整个网段发起 TCP 连接（Modbus 扫的是
  # 502，广播类协议还会发 UDP 广播），某些生产网络对此有明确的禁止条款。
  # 关闭后 /deviceScan/* 全部返回"功能未启用"，采集与上报完全不受影响。
  enabled: true

  # 同时在飞的目标探测数（默认 8，上限 32）。
  # 乘上单目标耗时就是扫一个网段的墙钟时间，同时也是插件进程一侧的并发压力：
  # 每个在飞探测在插件里占一个 goroutine 与一条到目标的连接。
  # 调大能加快扫描，但会让网段上的交换机与设备同时承受更多连接尝试。
  maxConcurrentProbes: 8

  # 单次扫描的目标数上限（默认 1024，上限 65536）。
  #
  # 防手滑用的：一个 /16 展开是 65534 个目标，配上 1.5s 的拨号超时就是按小时计。
  # **截断不静默** —— 任务快照里带 requestedTargets / plannedTargets / truncated，
  # 前端会明确提示"只扫了前 N 个"，否则用户会从"没扫到设备"得出
  # "这个网段没有设备"的错误结论。
  maxTargets: 1024

  # 扫描结束后任务与结果在内存里的保留时长（分钟，默认 10）。
  #
  # 任务**不落库**（一次性运维动作，为它引入一张表与一次迁移不划算），
  # 代价是网关重启后尚未导入的结果会丢失。前端会提示任务已过期。
  jobTTLMinutes: 10

# 外部协议插件（进程外驱动）：把新增 PLC 协议驱动做成独立可执行文件，
# 丢进插件目录即自动加载，无需停机重编网关。详见 docs/driver-plugins.md。
plugin:
  # 总开关。**出厂即为 true**：全部协议驱动都已搬成插件（主二进制里不再有
  # 任何协议实现），关掉它等于网关不支持任何协议 —— 设备会全部被跳过，
  # 且症状很安静（只有一行 WARN，前端与健康检查都正常）。所以这里的 true
  # 是"产品能工作"的下限，不是可选的优化项。
  #
  # 代价必须说清楚：加载插件等于以网关自身的 OS 权限执行该目录下的可执行文件。
  # 插件是**可信代码**而非沙箱内容，部署方须自行保证 dir 只对管理员可写
  #（Unix 下网关会拒绝世界可写目录；Windows 的权限位无意义，只记警告）。
  # 详见 docs/driver-plugins.md §6 与 SECURITY.md。
  enabled: true

  # 插件目录。空或相对路径时相对「可执行文件所在目录」解析，而非当前工作目录
  #（Windows 服务由 sc create 注册，SCM 给的工作目录是 System32）。
  dir: plugins

  # 插件文件名匹配。
  glob: iot-driver-*

  scanIntervalMs: 10000        # 目录扫描间隔（毫秒）
  handshakeTimeoutMs: 10000    # describe 握手超时（毫秒）
  connectTimeoutMs: 30000      # connect / ping 超时（毫秒）
  # read 超时必须大于 protocolJSON 里配置的协议自身超时，否则网关会放弃插件
  # 仍在执行的调用，重试会在慢速串行总线上堆积。大批量点位建议再放大。
  readTimeoutMs: 60000
  restartMinDelayMs: 1000      # 崩溃重启退避下限（毫秒）
  restartMaxDelayMs: 30000     # 崩溃重启退避上限（毫秒）
  maxRestarts: 10              # 连续失败上限，超过后停止监管

  # 依据插件 describe 结果自动维护 iot_protocol 行（仅插入与补空，绝不覆盖
  # 运维手工编辑过的表单）。字段名取反是为了让配置缺省时等于「启用」。
  disableProtocolRowProvisioning: false

  # 允许插件目录为其他用户可写（不推荐）。Unix 下默认拒绝世界可写目录；
  # Windows 的 stat 权限位无意义，只记警告。
  allowInsecureDir: false

  # 关闭「运行期把已加载插件替换为磁盘上的新二进制」。字段名取反同样是为了
  # 让配置缺省时等于「启用」—— Enabled=true 已经等于允许以网关权限执行
  # 该目录下的代码，加载新版本与首次加载并无信任级别差异。
  # 置 true 后回退旧行为：检测到替换只警告，继续跑旧版本，重启网关才生效。
  disableHotUpgrade: false
